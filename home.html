<!DOCTYPE html>
<html lang="en" data-theme="winter">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>

<body class="min-h-screen max-w-md mx-auto">
    <div class="header flex justify-between items-center py-5 border-b-2">
        <div class="left">
            <div class="logo flex justify-center items-center">
                <img src="./assets/logo.png" class="w-[50px] h-full"  alt="">
                <div class="available-balance flex-col">
                    <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
                    <p>Available Balance</p>
                </div>
            </div>
        </div>
        <div class="right">
            <button class="btn">
                <a href="./index.html">Logout</a>
            </button>
        </div>
    </div>
    <div class="grid grid-cols-3 py-4 gap-3">
        <button class="btn btn-primary btn-soft flex-col h-full py-2">
            <img src="./assets/opt-1.png" alt="">
            <p>Add Money</p>
        </button>
        <button class="btn btn-primary btn-soft flex-col h-full py-2">
            <img src="./assets/opt-2.png" alt="">
            <p>Cash Out</p>
        </button>
        <button class="btn btn-primary btn-soft flex-col h-full py-2">
            <img src="./assets/opt-3.png" alt="">
            <p>Transfer Money</p>
        </button>
        <button class="btn btn-primary btn-soft flex-col h-full py-2">
            <img src="./assets/opt-4.png" alt="">
            <p>Get Bonus</p>
        </button>
        <button class="btn btn-primary btn-soft flex-col h-full py-2">
            <img src="./assets/opt-5.png" alt="">
            <p>Pay Bill</p>
        </button>
        <button class="btn btn-primary btn-soft flex-col h-full py-2">
            <img src="./assets/opt-6.png" alt="">
            <p>Transaction</p>
        </button>
    </div>




    <script src="script.js"></script>
</body>

</html>
