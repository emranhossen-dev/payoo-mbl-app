<!DOCTYPE html>
<html lang="en" data-theme="winter">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login p</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>

<body class="min-h-screen max-w-md mx-auto">
    <div class="logo">
        <img src="./assets/Logo-full.png"  alt="Payoo Logo" class="w-32 mx-auto mb-4 pt-32" />
    </div>
    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4 mx-auto">
        
        <label class="label">Mobile Number</label>
        <input id="number-input" minlength="11" maxlength="11" type="tel" class="input" placeholder="Mobile Number" />

        <label class="label">4 Digit Pin</label>
        <input id="pin-input" minlength="4" maxlength="4" type="password" class="input" placeholder="4 Digit Pin" />

        <button id="login-btn" class="btn btn-neutral mt-4">Login</button>
    </fieldset>


    <script src="script.js"></script>
</body>

</html>
